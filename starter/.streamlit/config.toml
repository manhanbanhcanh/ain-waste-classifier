# Visual Waste Sorting Assistant - Professional Theme
# Optimized for waste classification dashboard with recycling/sustainability aesthetic

[theme]
# Base theme
base = "light"

# Core colors - Earth/recycling inspired palette
primaryColor = "#2E7D32"           # Forest green - primary actions, links
backgroundColor = "#FAFAFA"        # Clean off-white main background
secondaryBackgroundColor = "#F1F8E9"  # Light sage - widget backgrounds, cards
textColor = "#212121"              # Near-black for readability

# Semantic status colors
redColor = "#C62828"               # Error/low confidence
orangeColor = "#EF6C00"            # Warning/medium confidence
yellowColor = "#F9A825"            # Caution
greenColor = "#2E7D32"             # Success/high confidence
blueColor = "#1565C0"              # Info/plastic
violetColor = "#6A1B9A"            # Special highlights
grayColor = "#616161"              # Neutral text

# Extended semantic backgrounds/text (auto-derived if not set)
greenBackgroundColor = "#E8F5E9"
greenTextColor = "#1B5E20"
redBackgroundColor = "#FFEBEE"
redTextColor = "#B71C1C"
orangeBackgroundColor = "#FFF3E0"
orangeTextColor = "#E65100"
blueBackgroundColor = "#E3F2FD"
blueTextColor = "#0D47A1"

# Chart colors - categorical for confidence bars (6 classes)
chartCategoricalColors = ["#8D6E63", "#00ACC1", "#546E7A", "#6D4C41", "#29B6F6", "#757575"]

# Sequential for any heatmaps
chartSequentialColors = ["#F1F8E9", "#DCEDC8", "#C5E1A5", "#AED581", "#9CCC65", "#8BC34A", "#7CB342", "#689F38", "#558B2F", "#33691E"]

# Typography - Clean, professional
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 14
baseFontWeight = 400
codeFontSize = "0.875rem"
codeFontWeight = 400

# Heading scale
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

# Links
linkUnderline = false
linkColor = "#2E7D32"

# Borders and radius - Modern rounded
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true

# DataFrame styling
dataframeBorderColor = "#D0D7DE"
dataframeHeaderBackgroundColor = "#F1F8E9"

# Sidebar - slightly differentiated
[theme.sidebar]
backgroundColor = "#F1F8E9"
secondaryBackgroundColor = "#E8F5E9"
codeBackgroundColor = "#E8F5E9"
textColor = "#212121"
borderColor = "#C5E1A5"
primaryColor = "#2E7D32"

# Dark mode variant (for users who prefer it)
[theme.dark]
primaryColor = "#66BB6A"
backgroundColor = "#1B1F1B"
secondaryBackgroundColor = "#242A24"
textColor = "#E8EAE8"
linkColor = "#81C784"
borderColor = "#3A423A"

redColor = "#EF5350"
orangeColor = "#FFB74D"
yellowColor = "#FFF176"
greenColor = "#66BB6A"
blueColor = "#64B5F6"
violetColor = "#CE93D8"
grayColor = "#B0BEC5"

greenBackgroundColor = "#1B3D1B"
greenTextColor = "#A5D6A7"
redBackgroundColor = "#3D1B1B"
redTextColor = "#EF9A9A"
orangeBackgroundColor = "#3D2E1B"
orangeTextColor = "#FFE082"
blueBackgroundColor = "#1B2D3D"
blueTextColor = "#90CAF9"

chartCategoricalColors = ["#A1887F", "#4DD0E1", "#78909C", "#8D6E63", "#64B5F6", "#9E9E9E"]
chartSequentialColors = ["#1B3D1B", "#2D5016", "#3D641A", "#4D781F", "#5D8C23", "#6DA028", "#7DB42C", "#8DC831", "#9DDC35", "#ADEF3A"]

dataframeBorderColor = "#3A423A"
dataframeHeaderBackgroundColor = "#2D5016"

[theme.dark.sidebar]
backgroundColor = "#242A24"
secondaryBackgroundColor = "#1B3D1B"
codeBackgroundColor = "#1B3D1B"
textColor = "#E8EAE8"
borderColor = "#3D641A"
primaryColor = "#66BB6A"